# Scenario E: Failures and Robustness
# Inject: PV inverter failure, Battery unavailability, EV-charger failure
# Sensor/observation failure, Temporary grid-service limit reduction
# Measure how quickly agents detect the issue, repair their policy, and restore service

scenario_id: "scenario_e"
name: "Failures and Robustness"
description: "Baseline scenario with various failure injections to test agent robustness and repair capabilities."

random_seed: 42
timestep_minutes: 15

community_import_limit_kw: 200
community_export_limit_kw: 150

carbon_intensity_file: null

buildings:
  - building_id: "building_0"
    building_type: "residential"
    location:
      lat: 40.0
      lon: -105.0
      timezone: "America/Denver"
    simulation_start: "2023-07-01"
    simulation_end: "2023-07-08"
    weather_file: "weather.csv"
    pv:
      capacity_kw: 8.0
      azimuth: 180
      tilt: 30
      efficiency: 0.20
      inverter_efficiency: 0.96
    battery:
      capacity_kwh: 13.5
      power_kw: 5.0
      efficiency_charge: 0.95
      efficiency_discharge: 0.95
      soc_min: 0.1
      soc_max: 0.9
      initial_soc: 0.5
    evs:
      - capacity_kwh: 60.0
        max_charge_kw: 11.0
        efficiency: 0.90
        arrival_time: "18:00"
        departure_time: "07:00"
        target_soc: 0.8
        initial_soc: 0.3
        connected_days: [0, 1, 2, 3, 4, 5, 6]
    flexible_loads:
      - power_kw: 3.0
        energy_kwh: 6.0
        earliest_start: "20:00"
        latest_end: "06:00"
        duration_hours: 2.0
    tariff:
      type: "time_of_use"
      import_prices:
        "off_peak": 0.08
        "mid_peak": 0.12
        "on_peak": 0.20
      export_prices:
        "off_peak": 0.03
        "mid_peak": 0.05
        "on_peak": 0.08
      demand_charge: 5.0

