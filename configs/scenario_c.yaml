pandapower:
  network_type: "ieee_34"
  bus_mappings:
    - building_id: "building_0"
      bus_idx: 1
      phase: "all"
      voltage_level: "LV"
    - building_id: "building_1"
      bus_idx: 3
      phase: "all"
      voltage_level: "LV"
    - building_id: "building_2"
      bus_idx: 5
      phase: "all"
      voltage_level: "LV"
    - building_id: "building_3"
      bus_idx: 7
      phase: "all"
      voltage_level: "LV"
    - building_id: "building_4"
      bus_idx: 9
      phase: "all"
      voltage_level: "LV"
  slack_bus: 0
  voltage_limits:
    min: 0.95
    max: 1.05
  line_loading_limit: 1.0
  transformer_loading_limit: 1.0
  run_power_flow_every: 1

energy_sharing:
  enabled: false
  market_type: "uniform_price"
  settlement_interval: "15min"

failures: []