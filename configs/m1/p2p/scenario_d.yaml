# Run id: {scenario_id}_{controller}_{seed} (supervisor RunSpec); one --output-dir per regime keeps regimes separate.
scenario_id: scenario_d
name: Local Energy Sharing and Settlement
description: 'Baseline scenario with local energy sharing enabled. Tests different
  settlement rules: uniform price, weighted, carbon-aware, and fairness-aware.'
