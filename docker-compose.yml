

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: saea-db
    environment:
      POSTGRES_DB: saea
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saea"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saea-network
    restart: unless-stopped

  # Redis for queue, caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: saea-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - saea-network
    restart: unless-stopped

  # Backend API (FastAPI, backend/app entry point)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sea-backend:${IMAGE_TAG:-latest}
    container_name: saea-api
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONHASHSEED=0
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/saea
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=false
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW_SECONDS=60
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./experiments:/app/experiments:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - saea-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend (React/Vite via nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sea-frontend:${IMAGE_TAG:-latest}
    container_name: saea-frontend
    environment:
      - VITE_API_URL=http://api:8000
      - VITE_WS_URL=ws://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - saea-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Prometheus metrics
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: saea-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - saea-network
    restart: unless-stopped

  # Grafana dashboards (port 3001 — 3000 is the frontend)
  grafana:
    image: grafana/grafana:10.2.0
    container_name: saea-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - saea-network
    restart: unless-stopped

  # Log aggregation with Loki
  loki:
    image: grafana/loki:2.9.0
    container_name: saea-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - saea-network
    restart: unless-stopped

  # Promtail for log collection
  promtail:
    image: grafana/promtail:2.9.0
    container_name: saea-promtail
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - saea-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  saea-network:
    driver: bridge
    name: saea-network
