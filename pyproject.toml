[project]
name = "service-aware-energy-agents"
version = "0.1.0"
description = "Service-Aware Multi-Agent Energy Communities with Physics-Grounded Code Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "citylearn>=3.0.0",
    "pandapower>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "gymnasium>=0.28.1,<0.29",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "pytest>=7.4.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
    "aiohttp>=3.9.0",
    "pydantic-settings>=2.1.0",
    "python-json-logger>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx2>=2.14.0",
    "gunicorn>=21.0.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
    "redis>=5.0.0",
    "rq>=1.16.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pragmatic gate: correctness rules only. Style is black's job (E501 included).
# Broader rule families (UP/BLE/I/PIE/RUF) are a follow-up cleanup, not a gate.
select = ["F", "E4", "E7", "E9", "W6"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]  # package re-exports
"tests/*" = ["F401", "F841", "F823"]
"experiments/*" = ["F841", "E741"]
"backend/app/state.py" = ["F401"]  # try/except availability probe for rq
"backend/app/routers/*" = ["F841", "E402"]
"src/agents/agent_controller_interface.py" = ["E722"]
"src/agents/*" = ["F841"]  # agent-loop leftovers queued for cleanup
# Legacy modules queued for cleanup (Backend A structure task); correctness
# rules stay on everywhere else.
"src/api/*" = ["E402", "E722", "F841"]
"src/coordination/*" = ["F841", "F821", "E741"]
"src/controllers/*" = ["F841", "F811", "F821", "E402", "E722"]
"src/evaluation/*" = ["F841", "E731"]
"src/simulation/*" = ["F841", "E722", "E741", "E402", "F821"]
"src/schemas/*" = ["E402"]
"src/sandbox_compat.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true