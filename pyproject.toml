[project]
name = "service-aware-energy-agents"
version = "0.1.0"
description = "Service-Aware Multi-Agent Energy Communities with Physics-Grounded Code Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "citylearn>=3.0.0",
    "pandapower>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "gymnasium>=0.28.1,<0.29",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "pytest>=7.4.0",
    "scipy>=1.11.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true