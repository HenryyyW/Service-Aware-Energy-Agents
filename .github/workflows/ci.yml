name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]"

      - name: Check OpenAPI schema drift
        run: python scripts/check_openapi_drift.py

      - name: Run test suite
        run: pytest -q tests --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check i18n locales (key coverage, placeholders)
        run: npm run i18n:check

      - name: Build
        run: npm run build

  reproducibility:
    name: Seed reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache CityLearn datasets
        uses: actions/cache@v4
        with:
          path: ~/.cache/citylearn
          key: citylearn-datasets-v1-3.11
          restore-keys: |
            citylearn-datasets-v1-

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Warm the vendored cache so the reproducibility run never hits the
      # CityLearn GitHub API from a rate-limited shared runner IP (the 403
      # flake seen 2026-11-10, run 42753485311). Same wiring as ci-cd.yml.
      - name: Prefetch CityLearn datasets
        run: |
          python scripts/prefetch_citylearn.py \
            --dataset citylearn_challenge_2022_phase_all_plus_evs \
            --dataset citylearn_challenge_2020_climate_zone_1

      # CITYLEARN_OFFLINE=1 turns any mid-run download attempt into a hard,
      # loud failure instead of a silent GitHub-API 403 flake. Safe because
      # the prefetch step above guarantees a warm cache.
      - name: Same seed must produce identical outputs
        env:
          CITYLEARN_OFFLINE: "1"
        run: |
          python -m experiments.check_reproducibility \
            --config configs/scenario_a.yaml \
            --controller rule_based \
            --seeds 42 \
            --replicates 2 \
            --max-steps 8 \
            --report reports/reproducibility.json

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-report
          path: reports/reproducibility.json
          if-no-files-found: ignore
          retention-days: 7

  artifact-hygiene:
    name: Artifact hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reject generated/large artifacts in git
        run: python scripts/check_artifacts.py
