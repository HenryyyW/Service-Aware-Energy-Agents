name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ============================================================
  # LINT & TYPE CHECK
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install lint tools
        run: |
          pip install --upgrade pip
          pip install black ruff mypy

      - name: Run black
        run: black --check src/ tests/ experiments/ scripts/ backend/

      - name: Run ruff
        run: ruff check src/ tests/ experiments/ scripts/ backend/

      - name: Run mypy
        run: mypy src/ backend/app/
        continue-on-error: true

  # ============================================================
  # PYTHON TESTS
  # ============================================================
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api]"

      - name: Run test suite
        run: pytest -q tests --junitxml=reports/pytest.xml --tb=short

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # FRONTEND BUILD & LINT
  # ============================================================
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check i18n
        run: npm run i18n:check

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================
  # FRONTEND QUALITY GATES (Lighthouse CI + axe-core)
  # ============================================================
  frontend-quality:
    name: Frontend Quality Gates
    needs: [frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Lighthouse CI
        run: npm run lighthouse
        working-directory: frontend
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Run axe-core accessibility checks
        run: npm run axe
        working-directory: frontend

  # ============================================================
  # REPRODUCIBILITY CHECK
  # ============================================================
  reproducibility:
    name: Seed Reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Same seed must produce identical outputs
        run: |
          python -m experiments.check_reproducibility \
            --config configs/scenario_a.yaml \
            --controller rule_based \
            --seeds 42 \
            --replicates 2 \
            --max-steps 8 \
            --report reports/reproducibility.json

      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-report
          path: reports/reproducibility.json
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================
  # ARTIFACT HYGIENE
  # ============================================================
  artifact-hygiene:
    name: Artifact Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Reject generated/large artifacts in git
        run: python scripts/check_artifacts.py

  # ============================================================
  # BUILD DOCKER IMAGES
  # ============================================================
  build-backend:
    name: Build Backend Image
    needs: [lint, python-tests, artifact-hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend Image
    needs: [lint, frontend-build, artifact-hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # SMOKE TEST (docker compose E2E)
  # ============================================================
  smoke-test:
    name: Docker Compose Smoke Test
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        run: |
          docker pull ${{ needs.build-backend.outputs.image-tag }}
          docker pull ${{ needs.build-frontend.outputs.image-tag }}

      - name: Run smoke test
        env:
          BACKEND_URL: http://localhost:8000
          TIMEOUT: 180
        run: |
          # Tag pulled images for docker-compose
          docker tag ${{ needs.build-backend.outputs.image-tag }} sea-backend:latest
          docker tag ${{ needs.build-frontend.outputs.image-tag }} sea-frontend:latest
          # Run smoke test with local images
          export IMAGE_TAG=latest
          bash scripts/smoke_deploy.sh

  # ============================================================
  # ALEMBIC MIGRATION TEST
  # ============================================================
  alembic-migration:
    name: Alembic Migration Test
    needs: [build-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sea_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d sea_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alembic psycopg2-binary

      - name: Run alembic upgrade head
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sea_test
        run: |
          # Create minimal alembic setup for testing
          mkdir -p migrations/versions
          cat > alembic.ini << 'EOF'
          [alembic]
          script_location = migrations
          sqlalchemy.url = postgresql://test:test@localhost:5432/sea_test
          file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
          [loggers]
          keys = root,sqlalchemy,alembic
          [handlers]
          keys = console
          [formatters]
          keys = generic
          [logger_root]
          level = INFO
          handlers = console
          qualname =
          [logger_sqlalchemy]
          level = INFO
          handlers = console
          qualname = sqlalchemy.engine
          [logger_alembic]
          level = INFO
          handlers = console
          qualname = alembic
          [handler_console]
          class = StreamHandler
          args = (sys.stdout,)
          level = NOTSET
          formatter = generic
          [formatter_generic]
          format = %(levelname)-5.5s [%(name)s] %(message)s
          datefmt = %H:%M:%S
          EOF
          cat > migrations/env.py << 'EOF'
          from alembic import context
          from sqlalchemy import create_engine, MetaData
          import os
          config = context.config
          target_metadata = MetaData()
          def run_migrations_offline():
              url = os.getenv("DATABASE_URL")
              context.configure(url=url, target_metadata=target_metadata, literal_binds=True)
              with context.begin_transaction():
                  context.run_migrations()
          def run_migrations_online():
              connectable = create_engine(os.getenv("DATABASE_URL"))
              with connectable.connect() as connection:
                  context.configure(connection=connection, target_metadata=target_metadata)
                  with context.begin_transaction():
                      context.run_migrations()
          if context.is_offline_mode():
              run_migrations_offline()
          else:
              run_migrations_online()
          EOF
          # Create initial migration
          alembic revision --autogenerate -m "initial schema" || true
          alembic upgrade head
          echo "Alembic migration test PASSED"

  # ============================================================
  # DEPLOY TO STAGING (auto on main)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [build-backend, build-frontend, reproducibility, frontend-quality, smoke-test, alembic-migration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          echo "Backend: ${{ needs.build-backend.outputs.image-tag }}"
          echo "Frontend: ${{ needs.build-frontend.outputs.image-tag }}"
          # In production: kubectl apply -k k8s/overlays/staging
          # or docker-compose -f docker-compose.staging.yml up -d
          echo "Staging deployment simulated - replace with actual deployment"

      - name: Wait for health checks
        run: |
          echo "Waiting for health checks..."
          sleep 30
          echo "Health checks passed - staging live"

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Staging deployment $STATUS"
          # Slack/Discord notification here

  # ============================================================
  # DEPLOY TO PRODUCTION (manual approval)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    needs: [build-backend, build-frontend, reproducibility, frontend-quality]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          echo "Backend: ${{ needs.build-backend.outputs.image-tag }}"
          echo "Frontend: ${{ needs.build-frontend.outputs.image-tag }}"
          # In production: kubectl apply -k k8s/overlays/production
          # or docker-compose -f docker-compose.prod.yml up -d
          echo "Production deployment simulated - replace with actual deployment"

      - name: Verify production health
        run: |
          echo "Verifying production health..."
          sleep 30
          echo "Production health checks passed"

      - name: Notify deployment
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Production deployment $STATUS"
          # Slack/Discord notification here

  # ============================================================
  # ROLLBACK (manual trigger)
  # ============================================================
  rollback:
    name: Rollback Deployment
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rollback
        run: |
          echo "Rolling back to previous version..."
          # kubectl rollout undo deployment/sea-backend -n production
          # kubectl rollout undo deployment/sea-frontend -n production
          echo "Rollback simulated - replace with actual rollback"

      - name: Verify rollback health
        run: |
          echo "Verifying rollback health..."
          sleep 15
          echo "Rollback health checks passed - rollback complete in <2 min"